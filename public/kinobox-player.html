<!doctype html>
<html lang="uk">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="referrer" content="origin" />
  <title>CinemaVault Multi-Balancer</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      width: 100%;
      height: 100%;
      background: #000;
      color: #e2e8f0;
      font-family: system-ui, -apple-system, sans-serif;
      overflow: hidden;
    }
    .kinobox_player, #direct-iframe {
      width: 100%;
      height: 100%;
      border: none;
    }
    #fallback-msg {
      display: none;
      position: absolute;
      inset: 0;
      background: #07090e;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 24px;
      gap: 12px;
    }
    #fallback-msg h3 { color: #f8fafc; font-size: 16px; }
    #fallback-msg p { color: #94a3b8; font-size: 13px; max-width: 360px; line-height: 1.5; }
  </style>
</head>
<body>
  <div class="kinobox_player"></div>
  <div id="fallback-msg">
    <h3>Перемикання на резервне дзеркало...</h3>
    <p>Дзеркало Kinobox недоступне у вашій мережі. Автоматичний перехід на сусідній робочий сервер...</p>
  </div>

  <script>
    (function () {
      var params = new URLSearchParams(window.location.search);
      var imdb = params.get('imdb') || '';
      var tmdb = params.get('tmdb') || '';
      var title = params.get('title') || '';
      var season = params.get('season') || '';
      var episode = params.get('episode') || '';
      var reportedFatal = false;

      function notifyFatal(reason) {
        if (reportedFatal) return;
        reportedFatal = true;
        document.getElementById('fallback-msg').style.display = 'flex';
        try {
          window.top.postMessage({
            __cinemaPlayerBridge: true,
            type: 'subframeFatalError',
            reason: reason || 'kinoboxUnavailable'
          }, '*');
        } catch (e) {}
      }

      // First try direct Kinobox API to extract Ashdi / Voidboost / Alloha / Kodik iframe URLs directly
      var apiUrl = 'https://api.kinobox.tv/api/players?';
      var q = [];
      if (imdb) q.push('imdb=' + encodeURIComponent(imdb));
      if (tmdb) q.push('tmdb=' + encodeURIComponent(tmdb));
      if (title) q.push('title=' + encodeURIComponent(title));

      var timeout = setTimeout(function () {
        var container = document.querySelector('.kinobox_player');
        var hasIframe = container && container.querySelector('iframe');
        if (!hasIframe) {
          notifyFatal('kinoboxTimeout');
        }
      }, 4500);

      function bootKinoboxScript() {
        var script = document.createElement('script');
        script.src = 'https://kinobox.tv/static/kinobox.min.js';
        script.async = true;

        script.onload = function () {
          if (typeof window.kbox === 'function') {
            var searchCfg = {};
            if (imdb) searchCfg.imdb = imdb;
            if (tmdb) searchCfg.tmdb = tmdb;
            if (title) searchCfg.title = title;

            window.kbox('.kinobox_player', {
              search: searchCfg,
              menu: {
                enable: true,
                default: 'menu_list',
                mobile: 'menu_button',
                format: '{N} :: {T} ({Q})'
              },
              players: {
                ashdi: { enable: true, position: 1 },
                voidboost: { enable: true, position: 2 },
                alloha: { enable: true, position: 3 },
                kodik: { enable: true, position: 4 },
                collaps: { enable: true, position: 5 },
                veoveo: { enable: true, position: 6 },
                cdnmovies: { enable: true, position: 7 }
              }
            });
          } else {
            notifyFatal('kinoboxInitFailed');
          }
        };

        script.onerror = function () {
          notifyFatal('kinoboxScriptBlocked');
        };

        document.body.appendChild(script);
      }

      fetch(apiUrl + q.join('&'))
        .then(function (r) { return r.json(); })
        .then(function (data) {
          var list = Array.isArray(data) ? data : (data && Array.isArray(data.data) ? data.data : []);
          var valid = list.filter(function (p) {
            if (!p || !p.iframeUrl || typeof p.iframeUrl !== 'string') return false;
            var u = p.iframeUrl.toLowerCase();
            if (u.indexOf('loadbox') !== -1 || u.indexOf('namy.ws') !== -1) return false;
            return true;
          });
          if (valid.length === 0) {
            valid = list.filter(function (p) { return p && p.iframeUrl && typeof p.iframeUrl === 'string'; });
          }
          if (valid.length > 0) {
            clearTimeout(timeout);
            var priority = ['ashdi', 'voidboost', 'veoveo', 'collaps', 'nextembed', 'alloha', 'videoseed', 'kodik', 'cdnmovies', 'vibix'];
            var rankOf = function (p) {
              var key = (String(p.type || p.source || '') + ' ' + String(p.iframeUrl || '')).toLowerCase();
              for (var i = 0; i < priority.length; i++) {
                if (key.indexOf(priority[i]) !== -1) return i;
              }
              return priority.length;
            };
            var candidates = valid.slice().sort(function (a, b) { return rankOf(a) - rankOf(b); });
            var curIdx = 0;
            var container = document.querySelector('.kinobox_player');

            function loadCandidate(idx) {
              if (idx >= candidates.length) {
                notifyFatal('kinoboxAllFailed');
                return;
              }
              curIdx = idx;
              var targetUrl = candidates[idx].iframeUrl.indexOf('//') === 0
                ? 'https:' + candidates[idx].iframeUrl
                : candidates[idx].iframeUrl;
              if (season && episode) {
                var sep = targetUrl.indexOf('?') === -1 ? '?' : '&';
                targetUrl += sep + 'season=' + encodeURIComponent(season) + '&episode=' + encodeURIComponent(episode);
              }
              container.innerHTML = '<iframe id="direct-iframe" scrolling="no" style="overflow:hidden;width:100%;height:100%;border:0;" src="' + targetUrl + '" allowfullscreen allow="autoplay; fullscreen; encrypted-media"></iframe>';
            }

            window.addEventListener('message', function (ev) {
              var d = ev && ev.data;
              if (d && typeof d === 'object' && d.__cinemaPlayerBridge && d.type === 'subframeFatalError') {
                loadCandidate(curIdx + 1);
              }
            });

            loadCandidate(0);
          } else {
            bootKinoboxScript();
          }
        })
        .catch(function () {
          bootKinoboxScript();
        });
    })();
  </script>
</body>
</html>
