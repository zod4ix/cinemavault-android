<!doctype html>
<html lang="uk">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="referrer" content="origin" />
  <title>CinemaVault HDRezka & Multi-Balancer</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      width: 100%;
      height: 100%;
      background: #000;
      color: #e2e8f0;
      font-family: system-ui, -apple-system, sans-serif;
      overflow: hidden;
    }
    .kinobox_player, #direct-iframe {
      width: 100%;
      height: 100%;
      border: none;
      display: block;
    }
    #fallback-msg {
      display: none;
      position: absolute;
      inset: 0;
      background: #07090e;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 24px;
      gap: 12px;
    }
    #fallback-msg h3 { color: #f8fafc; font-size: 16px; }
    #fallback-msg p { color: #94a3b8; font-size: 13px; max-width: 360px; line-height: 1.5; }
  </style>
</head>
<body>
  <div class="kinobox_player"></div>
  <div id="fallback-msg">
    <h3>Перемикання на резервне дзеркало...</h3>
    <p>Автоматичний перехід на сусідній робочий сервер...</p>
  </div>

  <script>
    (function () {
      try { window.open = function () { return null; }; } catch (e) {}
      var params = new URLSearchParams(window.location.search);
      var imdb = params.get('imdb') || '';
      var tmdb = params.get('tmdb') || '';
      var title = params.get('title') || '';
      var year = params.get('year') || '';
      var season = params.get('season') || '';
      var episode = params.get('episode') || '';
      var mirror = params.get('mirror') || '';
      var reportedFatal = false;

      function notifyFatal(reason) {
        if (reportedFatal) return;
        reportedFatal = true;
        document.getElementById('fallback-msg').style.display = 'flex';
        try {
          window.top.postMessage({
            __cinemaPlayerBridge: true,
            type: 'subframeFatalError',
            reason: reason || 'balancerUnavailable'
          }, '*');
        } catch (e) {}
      }

      function resolveImdbFast() {
        if (imdb && imdb.indexOf('tt') === 0) return Promise.resolve(imdb);
        if (!title) return Promise.resolve('');
        var clean = title.trim();
        return fetch('https://v3.sg.media-imdb.com/suggestion/x/' + encodeURIComponent(clean) + '.json')
          .then(function (r) { return r.json(); })
          .then(function (data) {
            var list = (data && Array.isArray(data.d)) ? data.d : [];
            var valid = list.filter(function (x) { return x && typeof x.id === 'string' && x.id.indexOf('tt') === 0; });
            if (valid.length === 0) return '';
            if (year) {
              var yr = parseInt(year, 10);
              for (var i = 0; i < valid.length; i++) {
                if (Math.abs((Number(valid[i].y) || 0) - yr) <= 1) return valid[i].id;
              }
            }
            return valid[0].id;
          })
          .catch(function () { return ''; });
      }

      var mirrorHosts = {
        embess: 'api.embess.ws',
        namy: 'api.namy.ws',
        kinogram: 'api.kinogram.best',
        delivembd: 'api.delivembd.ws'
      };

      function resolveUakinoOrAshdi() {
        var qParts = [];
        if (imdb) qParts.push('imdb=' + encodeURIComponent(imdb));
        if (tmdb) qParts.push('tmdb=' + encodeURIComponent(tmdb));
        if (title) qParts.push('title=' + encodeURIComponent(title));
        if (qParts.length === 0) return Promise.resolve([]);

        return fetch('https://api.kinobox.tv/api/players?' + qParts.join('&'))
          .then(function (r) { return r.json(); })
          .then(function (data) {
            var list = Array.isArray(data) ? data : (data && Array.isArray(data.data) ? data.data : []);
            var ashdiUrls = [];
            var otherUaUrls = [];
            for (var i = 0; i < list.length; i++) {
              var p = list[i];
              if (!p || typeof p.iframeUrl !== 'string') continue;
              var rawUrl = p.iframeUrl.indexOf('//') === 0 ? ('https:' + p.iframeUrl) : p.iframeUrl;
              var srcLower = ((p.type || p.source || '') + ' ' + rawUrl).toLowerCase();
              if (srcLower.indexOf('ashdi') !== -1 || srcLower.indexOf('uakino') !== -1) {
                ashdiUrls.push(rawUrl);
              } else if (srcLower.indexOf('voidboost') !== -1 || srcLower.indexOf('rezka') !== -1 || srcLower.indexOf('alloha') !== -1 || srcLower.indexOf('veoveo') !== -1) {
                otherUaUrls.push(rawUrl);
              }
            }
            return ashdiUrls.concat(otherUaUrls);
          })
          .catch(function () { return []; });
      }

      resolveImdbFast().then(function (resolvedImdb) {
        imdb = resolvedImdb || imdb;
        var isSeries = Boolean(season && episode);
        var seQuery = isSeries ? ('?season=' + encodeURIComponent(season) + '&episode=' + encodeURIComponent(episode)) : '';

        var pUakino = (mirror === 'uakino' || !mirror) ? resolveUakinoOrAshdi() : Promise.resolve([]);

        pUakino.then(function (uaResolvedList) {
          var candidates = [];

          if (mirror === 'uakino') {
            for (var uIdx = 0; uIdx < uaResolvedList.length; uIdx++) {
              if (candidates.indexOf(uaResolvedList[uIdx]) === -1) {
                candidates.push(uaResolvedList[uIdx]);
              }
            }
          }

          if (mirror && mirrorHosts[mirror] && imdb) {
            candidates.push('https://' + mirrorHosts[mirror] + '/embed/imdb/' + imdb + seQuery);
          }

          if (!mirror && uaResolvedList.length > 0) {
            for (var kIdx = 0; kIdx < uaResolvedList.length; kIdx++) {
              if (candidates.indexOf(uaResolvedList[kIdx]) === -1) {
                candidates.push(uaResolvedList[kIdx]);
              }
            }
          }

          if (imdb) {
            var order = ['api.embess.ws', 'api.namy.ws', 'api.kinogram.best', 'api.delivembd.ws'];
            for (var i = 0; i < order.length; i++) {
              var u = 'https://' + order[i] + '/embed/imdb/' + imdb + seQuery;
              if (candidates.indexOf(u) === -1) candidates.push(u);
            }
          }

          if (tmdb) {
            candidates.push(
              isSeries
                ? 'https://vidlink.pro/tv/' + tmdb + '/' + season + '/' + episode + '?primaryColor=e50914&autoplay=true'
                : 'https://vidlink.pro/movie/' + tmdb + '?primaryColor=e50914&autoplay=true'
            );
            candidates.push(
              isSeries
                ? 'https://vidsrc.su/embed/tv/' + tmdb + '/' + season + '/' + episode
                : 'https://vidsrc.su/embed/movie/' + tmdb
            );
          } else if (imdb) {
            candidates.push(
              isSeries
                ? 'https://vidsrc.to/embed/tv/' + imdb + '/' + season + '/' + episode
                : 'https://vidsrc.to/embed/movie/' + imdb
            );
          }

          if (candidates.length === 0) {
            notifyFatal('noCandidates');
            return;
          }

          var curIdx = 0;
          var container = document.querySelector('.kinobox_player');

          function loadCandidate(idx) {
            if (idx >= candidates.length) {
              notifyFatal('allCandidatesFailed');
              return;
            }
            curIdx = idx;
            container.innerHTML = '<iframe id="direct-iframe" scrolling="no" style="overflow:hidden;width:100%;height:100%;border:0;background:#000;" src="' + candidates[idx] + '" allowfullscreen allow="autoplay; fullscreen; encrypted-media; picture-in-picture"></iframe>';
          }

          window.addEventListener('message', function (ev) {
            var d = ev && ev.data;
            if (!d || typeof d !== 'object') return;
            if (d.__cinemaPlayerBridge && d.type === 'subframeFatalError') {
              loadCandidate(curIdx + 1);
              return;
            }
            if (d.__cinemaCmd) {
              var sub = document.getElementById('direct-iframe');
              if (sub && sub.contentWindow) {
                try { sub.contentWindow.postMessage(d, '*'); } catch (e) {}
              }
            }
          });

          loadCandidate(0);
        });
      });
    })();
  </script>
</body>
</html>
